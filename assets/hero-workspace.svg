<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 1100" role="img" aria-labelledby="title desc">
  <title id="title">Abstract personal workspace</title>
  <desc id="desc">Layered notes, code panes, and geometric shapes in a calm workspace composition.</desc>
  <defs>
    <linearGradient id="bg" x1="0" x2="1" y1="0" y2="1">
      <stop offset="0" stop-color="#fdfbf4"/>
      <stop offset="0.5" stop-color="#d7eee4"/>
      <stop offset="1" stop-color="#e7ecf3"/>
    </linearGradient>
    <linearGradient id="panel" x1="0" x2="1" y1="0" y2="1">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="1" stop-color="#f1f6f4"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="22" stdDeviation="28" flood-color="#172026" flood-opacity="0.16"/>
    </filter>
    <pattern id="grid" width="36" height="36" patternUnits="userSpaceOnUse">
      <path d="M36 0H0V36" fill="none" stroke="#9db7b8" stroke-opacity="0.24" stroke-width="1"/>
    </pattern>
  </defs>

  <rect width="900" height="1100" rx="0" fill="url(#bg)"/>
  <rect x="0" y="0" width="900" height="1100" fill="url(#grid)" opacity="0.85"/>

  <circle cx="165" cy="170" r="74" fill="#f0bf4c" opacity="0.9"/>
  <rect x="642" y="112" width="128" height="128" rx="24" fill="#5651a8" opacity="0.9"/>
  <path d="M708 860L812 1040H604Z" fill="#d9654f" opacity="0.88"/>

  <g filter="url(#shadow)">
    <rect x="122" y="250" width="610" height="418" rx="18" fill="url(#panel)" stroke="#d9e0e5" stroke-width="2"/>
    <rect x="122" y="250" width="610" height="64" rx="18" fill="#172026"/>
    <circle cx="162" cy="282" r="9" fill="#d9654f"/>
    <circle cx="193" cy="282" r="9" fill="#f0bf4c"/>
    <circle cx="224" cy="282" r="9" fill="#63b58f"/>
    <rect x="166" y="360" width="206" height="16" rx="8" fill="#27594f"/>
    <rect x="166" y="402" width="438" height="12" rx="6" fill="#9db7b8"/>
    <rect x="166" y="434" width="344" height="12" rx="6" fill="#9db7b8"/>
    <rect x="166" y="486" width="172" height="116" rx="12" fill="#d7eee4"/>
    <rect x="372" y="486" width="216" height="116" rx="12" fill="#e7ecf3"/>
  </g>

  <g filter="url(#shadow)">
    <rect x="246" y="618" width="500" height="300" rx="18" fill="#ffffff" stroke="#d9e0e5" stroke-width="2"/>
    <rect x="294" y="674" width="260" height="18" rx="9" fill="#177c86"/>
    <rect x="294" y="724" width="354" height="12" rx="6" fill="#a3afb8"/>
    <rect x="294" y="756" width="282" height="12" rx="6" fill="#a3afb8"/>
    <rect x="294" y="810" width="118" height="48" rx="8" fill="#27594f"/>
    <rect x="434" y="810" width="118" height="48" rx="8" fill="#f0bf4c"/>
    <rect x="574" y="810" width="76" height="48" rx="8" fill="#d9654f"/>
  </g>

  <g filter="url(#shadow)">
    <rect x="104" y="700" width="236" height="210" rx="18" fill="#fff8df" stroke="#ead28c" stroke-width="2"/>
    <rect x="144" y="746" width="128" height="14" rx="7" fill="#d9654f"/>
    <rect x="144" y="790" width="150" height="10" rx="5" fill="#9f8b53"/>
    <rect x="144" y="820" width="108" height="10" rx="5" fill="#9f8b53"/>
    <path d="M144 864H292" stroke="#ead28c" stroke-width="2"/>
  </g>

  <g transform="translate(586 364)">
    <rect x="0" y="0" width="176" height="176" rx="24" fill="#172026"/>
    <path d="M52 66L30 88L52 110" fill="none" stroke="#d7eee4" stroke-width="12" stroke-linecap="round" stroke-linejoin="round"/>
    <path d="M124 66L146 88L124 110" fill="none" stroke="#d7eee4" stroke-width="12" stroke-linecap="round" stroke-linejoin="round"/>
    <path d="M102 48L74 128" fill="none" stroke="#f0bf4c" stroke-width="12" stroke-linecap="round"/>
  </g>
</svg>
